services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-analytics}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [analytics]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [analytics]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [analytics]

  ingestion-api:
    build: ./ingestion-api
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      EVENTS_STREAM: ${EVENTS_STREAM:-events:raw}
      SITE_KEYS: ${SITE_KEYS:?set SITE_KEYS in .env}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-20}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${INGESTION_PORT:-8787}:8787"
    networks: [analytics]

  worker:
    build: ./worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      EVENTS_STREAM: ${EVENTS_STREAM:-events:raw}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-workers}
      CONSUMER_NAME: ${CONSUMER_NAME:-worker-1}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      BLOCK_MS: ${BLOCK_MS:-5000}
      DATABASE_URL: postgres://${POSTGRES_USER:-analytics}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-analytics}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      GEOIP_DB_PATH: /geoip/GeoLite2-City.mmdb
      IP_HASH_PEPPER: ${IP_HASH_PEPPER:?set IP_HASH_PEPPER in .env}
      SESSION_GAP_SECONDS: ${SESSION_GAP_SECONDS:-1800}
    volumes:
      # Drop a GeoLite2-City.mmdb here to enable geo enrichment (planmode.md
      # §5) — absent is fine, the worker just skips it.
      - ./worker/geoip:/geoip:ro
    networks: [analytics]

  reporting-api:
    build: ./reporting-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      PORT: 8788
      HOST: 0.0.0.0
      API_KEYS: ${API_KEYS:?set API_KEYS in .env}
      MAX_DATE_RANGE_DAYS: ${MAX_DATE_RANGE_DAYS:-92}
      DEFAULT_SESSIONS_LIMIT: ${DEFAULT_SESSIONS_LIMIT:-50}
      MAX_SESSIONS_LIMIT: ${MAX_SESSIONS_LIMIT:-500}
      DEFAULT_TOP_PAGES_LIMIT: ${DEFAULT_TOP_PAGES_LIMIT:-10}
      MAX_TOP_PAGES_LIMIT: ${MAX_TOP_PAGES_LIMIT:-100}
      DATABASE_URL: postgres://${POSTGRES_USER:-analytics}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-analytics}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-analytics}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CORS_ORIGIN: ${DASHBOARD_CORS_ORIGIN:-*}
    ports:
      - "${REPORTING_PORT:-8788}:8788"
    networks: [analytics]

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - reporting-api
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    networks: [analytics]

volumes:
  pgdata:
  clickhouse-data:
  redis-data:

networks:
  analytics:
